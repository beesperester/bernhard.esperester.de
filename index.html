<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2e6e24" />
    <meta name="description" content="A tiny garden full of cats. Every visitor is one." />
    <title>bernhard.esperester.de</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- added to the home screen it opens full screen (iPhones can't go full screen from the browser) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cat Garden" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>
    <div id="status" class="hud">loading…</div>
    <div id="help" class="hud">← ↑ ↓ → move · SPACE jump (up trees too, ↓ to drop) · SHIFT dash · X sneak · C catch (or paw at a tree or a monument) · H hiss · R roll · E mew · M music · S sounds · F full screen</div>
    <div id="touch" hidden>
      <div id="dpad"></div>
      <div id="buttons">
        <button data-btn="hiss" class="small">HISS</button>
        <button data-btn="roll" class="small">ROLL</button>
        <button data-btn="sneak" class="small">SNEAK</button>
        <button data-btn="catch" class="small">CATCH</button>
        <button data-btn="mew" class="small">MEW</button>
        <button data-btn="dash" class="b">B</button>
        <button data-btn="jump" class="a">A</button>
      </div>
    </div>
    <div id="board" class="hud"><div class="title">snacks eaten</div><ol></ol></div>
    <div id="name-dialog" hidden>
      <form class="hud">
        <p><b><span class="count"></span> snacks!</b> You've earned a name of your own.</p>
        <input type="text" autocomplete="off" spellcheck="false" aria-label="Your cat's name" />
        <p class="error" aria-live="polite"></p>
        <div class="actions">
          <button type="button" class="keep"></button>
          <button type="submit">Name my cat</button>
        </div>
      </form>
    </div>
    <div id="credit" class="hud"></div>
    <button id="music" class="hud" aria-label="Toggle music"></button>
    <button id="sound" class="hud" aria-label="Toggle sounds"></button>
    <button id="fullscreen" class="hud" aria-label="Toggle full screen"></button>
    <div id="tip" class="hud" hidden></div>
    <noscript>This garden needs JavaScript to let the cats in.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
